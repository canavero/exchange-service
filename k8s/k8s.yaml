apiVersion: v1
kind: ConfigMap
metadata:
  name: exchange-configmap
data:
  REDIS_HOST: redis
  EXCHANGE_PROVIDER_URL: https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exchange
  labels:
    app: exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exchange
  template:
    metadata:
      labels:
        app: exchange
    spec:
      enableServiceLinks: false # sem isso o k8s injeta REDIS_PORT=tcp://<ip>:6379 (Service "redis") e quebra o Spring
      containers:
        - name: exchange
          image: DOCKERHUB_USER/exchange-service:latest
          imagePullPolicy: IfNotPresent # CI faz deploy com tag imutável :<sha>; evita o limite de pulls do Docker Hub
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: exchange-configmap
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /exchanges/actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36 # até 3 min para a JVM subir
          livenessProbe:
            httpGet:
              path: /exchanges/actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /exchanges/actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exchange
  labels:
    app: exchange
spec:
  type: ClusterIP
  selector:
    app: exchange
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: exchange
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: exchange
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
